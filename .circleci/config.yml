version: 2.1

# Mirrors .github/workflows/ci.yml (push/PR to main, Node 20/22/24 matrix).
# See the summary for the GitHub Actions steps that could not be translated 1:1.

jobs:
  ci:
    parameters:
      node-version:
        type: string
    docker:
      - image: cimg/node:<< parameters.node-version >>
    working_directory: ~/ofetch
    steps:
      - checkout

      # package.json pins "packageManager": "pnpm@10.20.0"; corepack activates it.
      - run:
          name: Enable corepack (pnpm from package.json packageManager)
          command: |
            sudo corepack enable
            corepack prepare --activate
            pnpm --version

      - run:
          name: Configure pnpm store directory
          command: pnpm config set store-dir ~/.pnpm-store

      - restore_cache:
          keys:
            - pnpm-v1-<< parameters.node-version >>-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v1-<< parameters.node-version >>-

      - run:
          name: Install dependencies
          command: pnpm install

      - save_cache:
          key: pnpm-v1-<< parameters.node-version >>-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store

      - run:
          name: Lint
          command: pnpm lint

      - run:
          name: Build
          command: pnpm build

      - run:
          name: Test (with coverage)
          command: pnpm vitest run --coverage

      # vitest.config.ts coverage reporters: text, clover, json -> coverage/
      - store_artifacts:
          path: coverage
          destination: coverage

      - store_artifacts:
          path: dist
          destination: dist

workflows:
  ci:
    jobs:
      - ci:
          name: ci-node-<< matrix.node-version >>
          matrix:
            parameters:
              node-version: ["20", "22", "24"]
