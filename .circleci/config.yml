version: 2.1

jobs:
  ofetch:
    docker:
      - image: cimg/node:24.21
    steps:
      - checkout
      - run:
          name: Enable pnpm via corepack
          command: |
            corepack enable
            corepack prepare --activate
            pnpm config set store-dir ~/.pnpm-store
      - restore_cache:
          keys:
            - pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-v1-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
      - run:
          name: Build
          command: pnpm build
      - run:
          name: Test
          command: pnpm vitest run --coverage
      - run:
          name: Lint
          command: pnpm lint

workflows:
  ci:
    jobs:
      - ofetch
